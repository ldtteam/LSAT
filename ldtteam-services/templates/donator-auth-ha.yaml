apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: donator-auth-ha
  namespace: argocd
spec:
  project: ldtteam
  destination:
    server: "https://kubernetes.default.svc"
    namespace: minecolonies-donator-auth
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
  sources:
    - repoURL: https://ldtteam.github.io/authentication
      chart: ldtteam-authentication-server
      targetRevision: "0.5.*"
      helm:
        releaseName: donator-auth
        valuesObject:
          fullnameOverride: donator-auth
          nameOverride: donator-auth
          ingress:
            hostname: auth.minecolonies.com
            annotations:
              external-dns.alpha.kubernetes.io/target: cluster.ldtteam.com
          discordBot:
            enabled: true
          rewardsService:
            enabled: true
          app:
            opssecret: donator-auth-ldtteam-authentication-server
            config:
              GitHub:
                ClientId: Iv1.1dd3379574845528
                ApplicationId: 127714
                Organisation: ldtteam
              Patreon:
                ClientId: vczZ_-e9ZkZ8dF5d-0ely8pL0yMq5U2wNq_-mCPiMCfsDpJjfY7XJdLreqbjqKu6
                ApiClientId: uWqCHPyalFE27zDU_OU87INED-_GUxpfm5vpSO9xpO9jTqJSOjABUt9IVJsissGQ
                CampaignId: 355933
                NormalizeDollarsToEuros: true
              Minecraft:
                ClientId: c44fb555-70db-4457-92f7-78309c6e62b8
              Discord:
                ClientId: '867378591817400330'
                Server:
                  'Minecolonies Insights':
                    Id: "472875599422291968"
                LoggingChannel:
                  Server: Minecolonies Insights
                  Channel: auth-service
                RoleMappings:
                  '472875599422291968':
                    discord-role:
                      - 472879389063905300
                      - 937834890613899300
                  '139070364159311872':
                    discord-role:
                      - 835040295850344400
                      - 240844823823646720
                      - 835041474462351400
                OptionalRoles:
                  - 240844823823646720
                  - 472879389063905300
                RemoveUsersFromRoles: true
          postgresha:
            enabled: true
          postgresql:
            enabled: false

    - repoURL: {{ .Values.repository.url }}
      path: ldtteam-charts/donator-auth-ha-extras
      targetRevision: HEAD
      helm:
